<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Saytim</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        header {
            background: #4a90e2;
            color: white;
            padding: 50px 20px;
        }
        h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        p {
            font-size: 1.2rem;
        }
        .container {
            padding: 40px 20px;
        }
        .btn {
            display: inline-block;
            background: #ff5722;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn:hover {
            background: #e64a19;
        }
    </style>
</head>
<body>

    <header>
        <h1>Xush kelibsiz!</h1>
        <p>Bu sizning shaxsiy yoki biznes saytingizning boshlang'ich sahifasi.</p>
    </header>

    <div class="container">
        <h2>Sayt haqida</h2>
        <p>Bu yerga o'z faoliyatingiz, xizmatlaringiz yoki mahsulotlaringiz haqida ma'lumot yozishingiz mumkin.</p>
        <a href="#aloqa" class="btn">Bog'lanish</a>
    </div>

</body>
</html>
